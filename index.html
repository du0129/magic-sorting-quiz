<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>霍格沃茨分院测试 | 发现你的魔法人格档案</title>
<meta name="description" content="18道情境选择，发现你的魔法人格档案。非官方粉丝向互动测试。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&amp;family=Noto+Serif+SC:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0908;--bg2:#12100c;--card:rgba(22,20,16,.92);--card2:rgba(30,26,20,.88);
  --gold:#c5a572;--gold-bright:#e8c87a;--gold-dim:#8a7350;--gold-soft:rgba(197,165,114,.15);
  --text:#e8dcc8;--text-dim:#a09484;--text-faint:#6e665c;
  --red:#8b1a1a;--green:#1a5c3a;--blue:#1a3a6b;--yellow:#8a6d1a;
  --line:rgba(197,165,114,.25);--line-bright:rgba(197,165,114,.5);
  --shadow:0 8px 32px rgba(0,0,0,.5);
}
html{scroll-behavior:smooth}
body{font-family:'Noto Serif SC',Georgia,'Times New Roman',serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;position:relative}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(197,165,114,.06) 0%,transparent 50%),radial-gradient(ellipse at 50% 100%,rgba(139,26,26,.04) 0%,transparent 50%);pointer-events:none;z-index:0}
#particles{position:fixed;inset:0;pointer-events:none;z-index:1}
.hidden{display:none!important}
.page{display:none;min-height:100vh;position:relative;z-index:2;padding:20px}
.page.active{display:flex;flex-direction:column;align-items:center;animation:fadeUp .6s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes glow{0%,100%{box-shadow:0 0 8px rgba(197,165,114,.3)}50%{box-shadow:0 0 20px rgba(197,165,114,.6)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes barGrow{from{width:0}}

/* ===== ACCESS PAGE ===== */
.access-wrap{max-width:440px;width:100%;text-align:center;margin:auto;padding:36px 0}
.access-card{position:relative;padding:38px 26px 32px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.access-card::before,.access-card::after{content:'';position:absolute;width:28px;height:28px;border:1px solid var(--gold-dim);opacity:.55}
.access-card::before{top:8px;left:8px;border-right:none;border-bottom:none}
.access-card::after{right:8px;bottom:8px;border-left:none;border-top:none}
.access-sigil{width:72px;height:72px;margin:0 auto 18px;animation:float 4s ease-in-out infinite}
.access-sigil svg{display:block;width:100%;height:100%;filter:drop-shadow(0 0 12px rgba(197,165,114,.25))}
.access-label{font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:4px;color:var(--gold-dim);text-transform:uppercase;margin-bottom:12px}
.access-title{font-size:1.55rem;color:var(--gold-bright);letter-spacing:4px;margin-bottom:10px}
.access-subtitle{font-size:.9rem;color:var(--text-dim);margin-bottom:26px}
.access-form{display:flex;flex-direction:column;align-items:center;gap:14px}
.access-input{display:block;width:100%;max-width:320px;min-height:48px;padding:12px 16px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:4px;color:var(--text);font-family:'Cinzel','Noto Serif SC',serif;font-size:16px;letter-spacing:2px;text-align:center;text-transform:uppercase;outline:none;transition:border-color .3s,box-shadow .3s}
.access-input:focus{border-color:var(--gold);box-shadow:0 0 14px rgba(197,165,114,.12)}
.access-input::placeholder{color:var(--text-faint);letter-spacing:1px;text-transform:none}
.access-btn{width:100%;max-width:320px;min-height:48px}
.access-error{min-height:1.5em;margin-top:14px;color:#d99a8e;font-size:.82rem;line-height:1.5}

/* ===== COVER PAGE ===== */
.cover-wrap{max-width:480px;width:100%;text-align:center;padding:40px 0;margin:auto}
.cover-emblem{width:90px;height:90px;margin:0 auto 8px;position:relative}
.cover-emblem svg{width:100%;height:100%;filter:drop-shadow(0 0 12px rgba(197,165,114,.3))}
.cover-label{font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:4px;color:var(--gold-dim);text-transform:uppercase;margin-bottom:12px}
h1.cover-title{font-family:'Cinzel','Noto Serif SC',serif;font-size:2.2rem;font-weight:700;color:var(--gold-bright);letter-spacing:2px;margin-bottom:6px;text-shadow:0 0 20px rgba(197,165,114,.2)}
h1.cover-title .cn{display:block;font-family:'Noto Serif SC',serif;font-size:1.6rem;margin-top:4px;letter-spacing:6px}
.cover-divider{width:60%;height:1px;margin:18px auto;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent)}
.cover-subtitle{font-size:.92rem;color:var(--text-dim);font-style:italic;line-height:1.7;margin-bottom:20px;padding:0 10px}
.cover-intro{font-size:.85rem;color:var(--text-faint);line-height:1.6;margin-bottom:10px}
.cover-time{font-size:.78rem;color:var(--gold-dim);letter-spacing:1px;margin-bottom:28px}
.nickname-input{width:100%;max-width:320px;padding:12px 16px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:4px;color:var(--text);font-family:inherit;font-size:.9rem;text-align:center;outline:none;margin-bottom:20px;transition:border-color .3s}
.nickname-input:focus{border-color:var(--gold)}
.nickname-input::placeholder{color:var(--text-faint)}
.magic-btn{display:inline-block;padding:14px 48px;background:linear-gradient(135deg,rgba(197,165,114,.12),rgba(197,165,114,.05));border:1px solid var(--gold);border-radius:4px;color:var(--gold-bright);font-family:'Cinzel','Noto Serif SC',serif;font-size:1rem;font-weight:600;letter-spacing:2px;cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
.magic-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(197,165,114,.15),transparent);background-size:200% 100%;animation:shimmer 3s infinite}
.magic-btn:hover{background:linear-gradient(135deg,rgba(197,165,114,.2),rgba(197,165,114,.08));box-shadow:0 0 20px rgba(197,165,114,.3);transform:translateY(-2px)}
.magic-btn:active{transform:translateY(0)}
.cover-hint{font-size:.78rem;color:var(--text-faint);margin-top:14px}
.resume-btn{display:block;margin:16px auto 0;padding:8px 24px;background:transparent;border:1px solid var(--line);border-radius:4px;color:var(--text-dim);font-family:inherit;font-size:.82rem;cursor:pointer;transition:all .3s}
.resume-btn:hover{border-color:var(--gold-dim);color:var(--gold)}
.disclaimer{font-size:.68rem;color:var(--text-faint);margin-top:30px;padding:0 20px;line-height:1.5;opacity:.7}

/* ===== TEST PAGE ===== */
.test-wrap{max-width:560px;width:100%;margin:auto}
.test-header{margin-bottom:24px}
.q-counter{font-family:'Cinzel',serif;font-size:.82rem;color:var(--gold-dim);letter-spacing:2px;margin-bottom:10px;display:block;text-align:center}
.progress-track{width:100%;height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold-bright));border-radius:2px;transition:width .5s ease;box-shadow:0 0 8px rgba(197,165,114,.3)}
.q-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:28px 24px;margin-bottom:20px;position:relative;box-shadow:var(--shadow)}
.q-card::before,.q-card::after{content:'';position:absolute;width:20px;height:20px;border:1px solid var(--gold-dim);opacity:.4}
.q-card::before{top:6px;left:6px;border-right:none;border-bottom:none}
.q-card::after{bottom:6px;right:6px;border-left:none;border-top:none}
.q-text{font-size:1.02rem;line-height:1.8;color:var(--text);margin-bottom:22px;font-weight:500}
.options{display:flex;flex-direction:column;gap:10px}
.option{display:block;width:100%;text-align:left;padding:14px 18px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:6px;color:var(--text-dim);font-family:inherit;font-size:.9rem;line-height:1.5;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
.option:hover{border-color:var(--gold-dim);color:var(--text);background:rgba(197,165,114,.06)}
.option.selected{border-color:var(--gold);color:var(--gold-bright);background:rgba(197,165,114,.1);box-shadow:0 0 12px rgba(197,165,114,.15)}
.option .opt-label{display:inline-block;width:24px;height:24px;line-height:22px;text-align:center;border:1px solid var(--line);border-radius:50%;font-family:'Cinzel',serif;font-size:.75rem;margin-right:10px;transition:all .25s;flex-shrink:0}
.option:hover .opt-label,.option.selected .opt-label{border-color:var(--gold);color:var(--gold)}
.test-nav{display:flex;justify-content:flex-start;gap:12px}
.nav-btn{padding:10px 28px;background:transparent;border:1px solid var(--line);border-radius:4px;color:var(--text-dim);font-family:inherit;font-size:.85rem;cursor:pointer;transition:all .3s}
.nav-btn:hover{border-color:var(--gold-dim);color:var(--text)}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}

/* ===== RESULT PAGE ===== */
.result-wrap{max-width:600px;width:100%;margin:20px auto;padding-bottom:40px}
.result-header{text-align:center;margin-bottom:30px}
.result-header h2{font-family:'Cinzel','Noto Serif SC',serif;font-size:1.6rem;color:var(--gold-bright);letter-spacing:2px;margin-bottom:6px}
.result-holder{font-size:.85rem;color:var(--text-dim);letter-spacing:1px}
.result-section{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px 20px;margin-bottom:16px;position:relative;box-shadow:var(--shadow)}
.result-section::before,.result-section::after{content:'';position:absolute;width:16px;height:16px;border:1px solid var(--gold-dim);opacity:.3}
.result-section::before{top:5px;left:5px;border-right:none;border-bottom:none}
.result-section::after{bottom:5px;right:5px;border-left:none;border-top:none}
.sec-title{font-family:'Cinzel','Noto Serif SC',serif;font-size:.78rem;color:var(--gold-dim);letter-spacing:3px;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.sec-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

/* Main House */
.house-main{text-align:center;padding:10px 0}
.house-name-en{font-family:'Cinzel',serif;font-size:2.4rem;font-weight:700;letter-spacing:4px;margin-bottom:4px;line-height:1.1}
.house-name-cn{font-size:1.3rem;letter-spacing:6px;margin-bottom:16px}
.house-title{font-size:1rem;font-style:italic;color:var(--text);line-height:1.6;padding:12px 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 auto;max-width:400px}

/* Commentary */
.hat-commentary{font-size:.92rem;line-height:1.85;color:var(--text-dim);text-indent:2em}
.hat-commentary::before{content:'"';font-size:2rem;color:var(--gold-dim);opacity:.3;position:absolute;top:8px;left:12px;font-family:Georgia,serif}

/* Keywords */
.keywords{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.keyword{padding:8px 18px;border:1px solid var(--line);border-radius:20px;font-size:.85rem;color:var(--gold);background:var(--gold-soft)}

/* Dimension Bars */
.dim-bars{display:flex;flex-direction:column;gap:12px}
.dim-bar-item{display:flex;align-items:center;gap:12px}
.dim-label{width:56px;font-size:.82rem;color:var(--text-dim);text-align:right;flex-shrink:0}
.dim-bar-track{flex:1;height:8px;background:rgba(255,255,255,.05);border-radius:4px;overflow:hidden;position:relative}
.dim-bar-fill{height:100%;border-radius:4px;transition:width 1s ease;position:relative}
.dim-bar-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);background-size:200% 100%;animation:shimmer 2s infinite}
.dim-value{width:36px;font-size:.78rem;color:var(--gold-dim);text-align:left;flex-shrink:0;font-family:'Cinzel',serif}

/* Radar Chart */
.radar-wrap{display:flex;justify-content:center;margin-bottom:10px}
.radar-svg{width:100%;max-width:320px;height:auto}
.radar-label{font-size:.7rem;fill:var(--text-dim);font-family:'Noto Serif SC',serif}
.radar-grid{fill:none;stroke:var(--line);stroke-width:.5}
.radar-axis{stroke:var(--line);stroke-width:.5}
.radar-data{fill-opacity:.15;stroke-width:2}
.radar-point{r:3}

/* House Percentages */
.house-pcts{display:flex;flex-direction:column;gap:10px}
.house-pct-item{display:flex;align-items:center;gap:12px}
.house-pct-name{width:80px;font-size:.82rem;color:var(--text-dim);flex-shrink:0}
.house-pct-track{flex:1;height:6px;background:rgba(255,255,255,.05);border-radius:3px;overflow:hidden}
.house-pct-fill{height:100%;border-radius:3px;transition:width 1.2s ease}
.house-pct-val{width:42px;font-size:.78rem;color:var(--gold-dim);font-family:'Cinzel',serif;text-align:left;flex-shrink:0}

/* Second House */
.second-house{text-align:center}
.second-house .sh-name{font-family:'Cinzel',serif;font-size:1.1rem;color:var(--gold);letter-spacing:2px;margin-bottom:10px}
.second-house .sh-desc{font-size:.88rem;line-height:1.7;color:var(--text-dim);font-style:italic}

/* Hat Hesitation */
.hat-hesitation{text-align:center;padding:12px;border:1px dashed var(--gold-dim);border-radius:6px;margin-bottom:16px;font-size:.85rem;color:var(--gold);font-style:italic;background:var(--gold-soft)}

/* Strengths & Blind Spots */
.strength-list,.blindspot-list{display:flex;flex-direction:column;gap:10px}
.strength-item,.blindspot-item{font-size:.88rem;line-height:1.6;color:var(--text-dim);padding-left:18px;position:relative}
.strength-item::before{content:'✦';position:absolute;left:0;color:var(--gold);font-size:.8rem}
.blindspot-item::before{content:'◈';position:absolute;left:0;color:var(--gold-dim);font-size:.8rem}

/* Role */
.magical-role{text-align:center;font-size:1rem;color:var(--gold);padding:16px;border:1px solid var(--line);border-radius:6px;background:var(--gold-soft)}
.magical-role .role-label{font-size:.75rem;color:var(--text-faint);letter-spacing:2px;display:block;margin-bottom:8px}

/* Signature */
.signature{text-align:center;padding:8px 0}
.signature-text{font-size:1.15rem;font-style:italic;color:var(--gold-bright);line-height:1.6;font-weight:500}
.signature-deco{width:40%;height:1px;margin:14px auto 0;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent)}

/* Result Actions */
.result-actions{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:24px}
.action-row{display:flex;gap:12px}

/* ===== SHARE CARD ===== */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal.hidden{display:none}
.modal-overlay{position:absolute;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(4px)}
.modal-content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:16px}
.share-card{width:320px;height:427px;border-radius:12px;overflow:hidden;position:relative;box-shadow:0 12px 40px rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:28px 24px}
.sc-bg{position:absolute;inset:0;z-index:0}
.sc-content{position:relative;z-index:1;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center}
.sc-top{display:flex;flex-direction:column;align-items:center;gap:6px}
.sc-label{font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:3px;color:rgba(255,255,255,.5)}
.sc-title{font-family:'Cinzel','Noto Serif SC',serif;font-size:.9rem;letter-spacing:2px;color:rgba(255,255,255,.8)}
.sc-mid{display:flex;flex-direction:column;align-items:center;gap:8px}
.sc-house-en{font-family:'Cinzel',serif;font-size:1.8rem;font-weight:700;letter-spacing:3px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.sc-house-cn{font-size:1rem;letter-spacing:4px;color:rgba(255,255,255,.85)}
.sc-second{font-size:.7rem;color:rgba(255,255,255,.5);letter-spacing:1px;margin-top:4px}
.sc-keywords{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.sc-kw{font-size:.68rem;padding:3px 10px;border:1px solid rgba(255,255,255,.25);border-radius:12px;color:rgba(255,255,255,.7)}
.sc-bottom{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.sc-pcts{display:flex;gap:8px;justify-content:center;width:100%}
.sc-pct-item{display:flex;flex-direction:column;align-items:center;gap:2px}
.sc-pct-name{font-size:.58rem;color:rgba(255,255,255,.5)}
.sc-pct-val{font-size:.72rem;font-family:'Cinzel',serif;color:rgba(255,255,255,.8)}
.sc-sig{font-size:.72rem;font-style:italic;color:rgba(255,255,255,.6);line-height:1.4;padding:0 8px}
.sc-nick{font-size:.75rem;color:rgba(255,255,255,.6);margin-top:4px}
.modal-hint{font-size:.78rem;color:var(--text-dim);text-align:center}

/* ===== RESPONSIVE ===== */
@media(min-width:768px){
  h1.cover-title{font-size:2.8rem}
  h1.cover-title .cn{font-size:2rem}
  .q-text{font-size:1.1rem}
  .house-name-en{font-size:3rem}
  .house-name-cn{font-size:1.6rem}
  .result-header h2{font-size:2rem}
  .share-card{width:360px;height:480px}
}
@media(max-width:360px){
  .page{padding:14px}
  .access-card{padding:32px 18px 26px}
  .access-title{font-size:1.3rem;letter-spacing:2px}
  h1.cover-title{font-size:1.8rem}
  h1.cover-title .cn{font-size:1.3rem}
  .q-text{font-size:.95rem}
  .option{padding:12px 14px;font-size:.85rem}
  .dim-label{width:48px;font-size:.75rem}
}
</style>
</head>
<body>
<canvas id="particles"></canvas>

<!-- ===== ACCESS PAGE ===== -->
<section id="access-page" class="page active">
  <div class="access-wrap">
    <div class="access-card">
      <div class="access-sigil" aria-hidden="true">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="46" fill="none" stroke="#c5a572" stroke-width="1" opacity="0.45"></circle>
          <path d="M50 15 L57 39 L82 39 L62 54 L70 78 L50 63 L30 78 L38 54 L18 39 L43 39 Z" fill="none" stroke="#c5a572" stroke-width="1.2" opacity="0.75"></path>
          <circle cx="50" cy="50" r="5" fill="#c5a572" opacity="0.55"></circle>
        </svg>
      </div>
      <p class="access-label">Academy Admission Pass</p>
      <h1 class="access-title">魔法学院入学凭证</h1>
      <div class="cover-divider"></div>
      <p class="access-subtitle">请输入你的测试提取码</p>
      <form id="access-form" class="access-form" novalidate>
        <input type="text" id="access-code-input" class="access-input" placeholder="输入提取码" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go" aria-describedby="access-error">
        <button type="submit" class="magic-btn access-btn">进入测试</button>
      </form>
      <p id="access-error" class="access-error" role="alert" aria-live="polite"></p>
    </div>
  </div>
</section>

<!-- ===== COVER PAGE ===== -->
<section id="cover-page" class="page">
  <div class="cover-wrap">
    <div class="cover-emblem">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="46" fill="none" stroke="#c5a572" stroke-width="1" opacity="0.4"></circle>
        <circle cx="50" cy="50" r="40" fill="none" stroke="#c5a572" stroke-width="0.5" opacity="0.3"></circle>
        <path d="M50 18 L54 40 L76 42 L58 52 L64 74 L50 62 L36 74 L42 52 L24 42 L46 40 Z" fill="none" stroke="#c5a572" stroke-width="1" opacity="0.6"></path>
        <circle cx="50" cy="50" r="3" fill="#c5a572" opacity="0.5"></circle>
      </svg>
    </div>
    <p class="cover-label">Hogwarts Sorting Ceremony</p>
    <h1 class="cover-title">HOGWARTS<span class="cn">霍格沃茨分院测试</span></h1>
    <div class="cover-divider"></div>
    <p class="cover-subtitle">「分院帽真正看见的，也许不是你的选择，<br>而是你最深层的本能。」</p>
    <p class="cover-intro">18 个选择，重新认识你的勇气、野心、<br>理性、忠诚与隐藏人格。</p>
    <p class="cover-time">预计测试时间：3–5 分钟</p>

// ============================================================
//  计分逻辑
// ============================================================
function calculateScores(answers) {
  const scores = { G:0, S:0, R:0, H:0 };
  DIM_KEYS.forEach(d => scores[d] = 0);
  answers.forEach((ans, i) => {
    if (ans === null) return;
    const opt = QUESTIONS[i].options[ans];
    if (!opt || !opt.s) return;
    for (const key in opt.s) {
      scores[key] = (scores[key] || 0) + opt.s[key];
    }
  });
  return scores;
}

function calculateMaxScores() {
  const max = { G:0, S:0, R:0, H:0 };
  DIM_KEYS.forEach(d => max[d] = 0);
  QUESTIONS.forEach(q => {
    HOUSE_KEYS.forEach(h => {
      let m = 0;
      q.options.forEach(o => { if (o.s && o.s[h]) m = Math.max(m, o.s[h]); });
      max[h] += m;
    });
    DIM_KEYS.forEach(d => {
      let m = 0;
      q.options.forEach(o => { if (o.s && o.s[d]) m = Math.max(m, o.s[d]); });
      max[d] += m;
    });
  });
  return max;
}
const MAX_SCORES = calculateMaxScores();

function generateResult(scores) {
  // 学院排名
  const houseScores = HOUSE_KEYS.map(h => ({ house:h, score:scores[h] }));
  houseScores.sort((a,b) => b.score - a.score);
  const main = houseScores[0].house;
  const second = houseScores[1].house;
  const total = houseScores.reduce((s,h) => s + h.score, 0) || 1;
  const percentages = {};
  houseScores.forEach(h => { percentages[h.house] = Math.round(h.score / total * 100); });
  
  // 分院帽犹豫
  const hesitation = (houseScores[0].score - houseScores[1].score) <= 3;
  
  // 维度排名
  const dimScores = DIM_KEYS.map(d => ({ dim:d, score:scores[d] }));
  dimScores.sort((a,b) => b.score - a.score);
  const topDims = dimScores.slice(0, 3).map(d => d.dim);
  const top2 = dimScores.slice(0, 2).map(d => d.dim);
  const bottomDim = dimScores[dimScores.length - 1].dim;
  
  // 维度百分比
  const dimPcts = {};
  DIM_KEYS.forEach(d => {
    dimPcts[d] = Math.round(scores[d] / (MAX_SCORES[d] || 1) * 100);
  });
  
  // 选标题
  const house = HOUSES[main];
  let title = house.titles[0].text;
  const matchedTitle = house.titles.find(t => t.dim === topDims[0]);
  if (matchedTitle) title = matchedTitle.text;
  
  // 选签名
  let signature = house.signatures[0].text;
  const matchedSig = house.signatures.find(s => s.dim === topDims[0]);
  if (matchedSig) signature = matchedSig.text;
  
  // 选角色
  let role = house.roles[0].text;
  const matchedRole = house.roles.find(r => r.dim === topDims[0]);
  if (matchedRole) role = matchedRole.text;
  
  // 选优势 (2-3条)
  let strengths = [];
  topDims.forEach(td => {
    const match = house.strengths.find(st => st.dim === td);
    if (match && !strengths.includes(match.text)) strengths.push(match.text);
  });
  while (strengths.length < 3) {
    const remaining = house.strengths.filter(st => !strengths.includes(st.text));
    if (remaining.length === 0) break;
    strengths.push(remaining[0].text);
  }
  
  // 选盲区 (2条)
  let blindSpots = [];
  const matchedBS = house.blindSpots.find(bs => bs.dim === bottomDim);
  if (matchedBS) blindSpots.push(matchedBS.text);
  const remainingBS = house.blindSpots.filter(bs => !blindSpots.includes(bs.text));
  blindSpots.push(remainingBS[0].text);
  
  // 关键词
  const keywords = top2.map(d => DIMENSIONS[d].kw);
  
  // 第二学院文案
  const secondKey = main + "-" + second;
  const secondText = SECOND_HOUSE_TEXTS[secondKey] || "";
  
  // 分院帽评语
  let commentary = COMMENTARY_BASE[main];
  commentary += COMMENTARY_DIM[topDims[0]] || "";
  if (topDims[1] && COMMENTARY_DIM[topDims[1]]) {
    commentary += COMMENTARY_DIM[topDims[1]];
  }
  commentary += COMMENTARY_BOTTOM[bottomDim] || "";
  
  return {
    main, second, house, percentages, hesitation,
    topDims, top2, bottomDim, dimPcts,
    title, signature, role, strengths, blindSpots,
    keywords, secondText, commentary, scores
  };
}

function showPage(pageId) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(pageId + "-page").classList.add("active");
  state.page = pageId;
  window.scrollTo(0, 0);
}

function hasAccess() {
  try {
    return sessionStorage.getItem(ACCESS_SESSION_KEY) === "true";
  } catch(e) {
    return false;
  }
}

function submitAccessCode() {
  const input = document.getElementById("access-code-input");
  const error = document.getElementById("access-error");
  const code = input.value.trim();

  if (!code) {
    error.textContent = "请输入提取码。";
    input.focus();
    return;
  }

  const normalizedCode = code.toUpperCase();
  const isValid = ACCESS_CODES.some(function(validCode) {
    return validCode.trim().toUpperCase() === normalizedCode;
  });

  if (!isValid) {
    error.textContent = "提取码无效，请重新确认。";
    input.select();
    return;
  }

  try {
    sessionStorage.setItem(ACCESS_SESSION_KEY, "true");
  } catch(e) {}
  error.textContent = "";
  showPage("cover");
}

function renderQuestion() {
  const q = QUESTIONS[state.qIndex];
  document.getElementById("q-counter").textContent =
    String(state.qIndex + 1).padStart(2,"0") + " / 18";
  document.getElementById("progress-fill").style.width =
    ((state.qIndex) / 18 * 100) + "%";
  document.getElementById("q-text").textContent = q.text;
  const optsContainer = document.getElementById("options");
  optsContainer.innerHTML = "";
  const labels = ["A","B","C","D"];
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option";
    if (state.answers[state.qIndex] === i) btn.classList.add("selected");
    btn.innerHTML = '<span class="opt-label">' + labels[i] + '</span>' + opt.text;
    btn.onclick = function() { selectOption(i); };
    optsContainer.appendChild(btn);
  });
  document.getElementById("prev-btn").style.visibility =
    state.qIndex > 0 ? "visible" : "hidden";
}

function selectOption(index) {
  state.answers[state.qIndex] = index;
  saveState();
  // 视觉反馈
  const opts = document.querySelectorAll(".option");
  opts.forEach((o, i) => o.classList.toggle("selected", i === index));
  // 延迟进入下一题
  setTimeout(function() {
    if (state.qIndex < 17) {
      state.qIndex++;
      renderQuestion();
      saveState();
    } else {
      // 完成
      state.scores = calculateScores(state.answers);
      state.result = generateResult(state.scores);
      saveState();
      renderResult();
      showPage("result");
    }
  }, 350);
}

function prevQuestion() {
  if (state.qIndex > 0) {
    state.qIndex--;
    renderQuestion();
    saveState();
  }
}

    document.querySelectorAll(".dim-bar-fill").forEach(function(el) {
      const w = el.style.width;
      el.style.width = "0";
      requestAnimationFrame(function() {
        el.style.width = w;
      });
    });
    document.querySelectorAll(".house-pct-fill").forEach(function(el) {
      const w = el.style.width;
      el.style.width = "0";
      requestAnimationFrame(function() {
        el.style.width = w;
      });
    });
  }, 100);
}

function buildRadarChart(dimPcts, house) {
  var cx = 160, cy = 160, R = 110;
  var n = DIM_KEYS.length;
  var pts = [];
  var gridPts25 = [], gridPts50 = [], gridPts75 = [], gridPts100 = [];
  
  for (var i = 0; i < n; i++) {
    var angle = -Math.PI / 2 + i * (2 * Math.PI / n);
    var val = (dimPcts[DIM_KEYS[i]] || 0) / 100;
    var x = cx + Math.cos(angle) * R * val;
    var y = cy + Math.sin(angle) * R * val;
    pts.push(x + "," + y);
    
    var x25 = cx + Math.cos(angle) * R * 0.25;
    var y25 = cy + Math.sin(angle) * R * 0.25;
    gridPts25.push(x25 + "," + y25);
    var x50 = cx + Math.cos(angle) * R * 0.5;
    var y50 = cy + Math.sin(angle) * R * 0.5;
    gridPts50.push(x50 + "," + y50);
    var x75 = cx + Math.cos(angle) * R * 0.75;
    var y75 = cy + Math.sin(angle) * R * 0.75;
    gridPts75.push(x75 + "," + y75);
    var x100 = cx + Math.cos(angle) * R;
    var y100 = cy + Math.sin(angle) * R;
    gridPts100.push(x100 + "," + y100);
  }
  
  var svg = '<svg class="radar-svg" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">';
  // Grid
  svg += '<polygon class="radar-grid" points="' + gridPts100.join(" ") + '" opacity="0.5"/>';
  svg += '<polygon class="radar-grid" points="' + gridPts75.join(" ") + '" opacity="0.4"/>';
  svg += '<polygon class="radar-grid" points="' + gridPts50.join(" ") + '" opacity="0.3"/>';
  svg += '<polygon class="radar-grid" points="' + gridPts25.join(" ") + '" opacity="0.2"/>';
  // Axes
  for (var i = 0; i < n; i++) {
    var angle = -Math.PI / 2 + i * (2 * Math.PI / n);
    var x100 = cx + Math.cos(angle) * R;
    var y100 = cy + Math.sin(angle) * R;
    svg += '<line class="radar-axis" x1="' + cx + '" y1="' + cy + '" x2="' + x100 + '" y2="' + y100 + '"/>';
  }
  // Data
  svg += '<polygon class="radar-data" points="' + pts.join(" ") + '" fill="' + house.color + '" stroke="' + house.colorLight + '"/>';
  // Points
  for (var i = 0; i < n; i++) {
    var angle = -Math.PI / 2 + i * (2 * Math.PI / n);
    var val = (dimPcts[DIM_KEYS[i]] || 0) / 100;
    var x = cx + Math.cos(angle) * R * val;
    var y = cy + Math.sin(angle) * R * val;
    svg += '<circle cx="' + x + '" cy="' + y + '" r="3" fill="' + house.colorLight + '"/>';
  }
  // Labels
  for (var i = 0; i < n; i++) {
    var angle = -Math.PI / 2 + i * (2 * Math.PI / n);
    var lx = cx + Math.cos(angle) * (R + 18);
    var ly = cy + Math.sin(angle) * (R + 18) + 4;
    svg += '<text class="radar-label" x="' + lx + '" y="' + ly + '" text-anchor="middle">' + DIMENSIONS[DIM_KEYS[i]].name + '</text>';
  }
  svg += '</svg>';
  return svg;
}

// ============================================================
function startTest() {
  state.nickname = document.getElementById("nickname-input").value.trim();
  state.qIndex = 0;
  state.answers = new Array(18).fill(null);
  state.scores = null;
  state.result = null;
  saveState();
  renderQuestion();
  showPage("test");
}

function resetTest() {
  state.qIndex = 0;
  state.answers = new Array(18).fill(null);
  state.scores = null;
  state.result = null;
  saveState();
  renderQuestion();
  showPage("test");
}

function goHome() {
  showPage("cover");
  checkResume();
}

// ============================================================
//  localStorage
// ============================================================
function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      qIndex: state.qIndex,
      answers: state.answers,
      nickname: state.nickname,
      result: state.result
    }));
  } catch(e) {}
}

function loadState() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch(e) { return null; }
}

function checkResume() {
  var saved = loadState();
  var btn = document.getElementById("resume-btn");
  if (saved && saved.answers && saved.answers.some(function(a) { return a !== null; })) {
    btn.classList.remove("hidden");
    btn.onclick = function() {
      state.qIndex = saved.qIndex || 0;
      state.answers = saved.answers || new Array(18).fill(null);
      state.nickname = saved.nickname || "";
      if (saved.nickname) document.getElementById("nickname-input").value = saved.nickname;
      renderQuestion();
      showPage("test");
    };
  } else {
    btn.classList.add("hidden");
  }
  
  // 如果有已完成的结果，显示在首页
  var existingViewBtn = document.getElementById("view-result-btn");
  if (saved && saved.result && !existingViewBtn) {
    var viewBtn = document.createElement("button");
    viewBtn.id = "view-result-btn";
    viewBtn.className = "resume-btn";
    viewBtn.textContent = "查看上次结果";
    viewBtn.onclick = function() {
      state.nickname = saved.nickname || "";
      state.scores = calculateScores(saved.answers);
      state.result = saved.result;
      if (saved.nickname) document.getElementById("nickname-input").value = saved.nickname;
      renderResult();
      showPage("result");
    };
    btn.parentNode.insertBefore(viewBtn, btn.nextSibling);
  }
}

function escapeHtml(str) {
  var div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

// ============================================================
//  粒子动画
// ============================================================
function initParticles() {
  var canvas = document.getElementById("particles");
  var ctx = canvas.getContext("2d");
  var particles = [];
  var w, h;
  
  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener("resize", resize);
  
  var count = window.innerWidth < 768 ? 25 : 45;
  for (var i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 1.5 + 0.3,
      vx: (Math.random() - 0.5) * 0.15,
      vy: -(Math.random() * 0.3 + 0.05),
      alpha: Math.random() * 0.4 + 0.1,
      pulse: Math.random() * Math.PI * 2
    });
  }
  
  function animate() {
    ctx.clearRect(0, 0, w, h);
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.pulse += 0.02;
      
      if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
      if (p.x < -10) p.x = w + 10;
      if (p.x > w + 10) p.x = -10;
      
      var a = p.alpha * (0.6 + 0.4 * Math.sin(p.pulse));
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(197,165,114," + a + ")";
      ctx.fill();
      
      // 光晕
      if (p.r > 0.8) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * 3, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(197,165,114," + (a * 0.08) + ")";
        ctx.fill();
      }
    }
    requestAnimationFrame(animate);
  }
  animate();
}

//  初始化
// ============================================================
function init() {
  document.getElementById("access-form").addEventListener("submit", function(e) {
    e.preventDefault();
    submitAccessCode();
  });
  document.getElementById("start-btn").addEventListener("click", startTest);
  document.getElementById("prev-btn").addEventListener("click", prevQuestion);
  document.getElementById("close-modal-btn").addEventListener("click", closeShareCard);
  document.getElementById("share-modal").querySelector(".modal-overlay").addEventListener("click", closeShareCard);
  
  // 回车提交昵称
  document.getElementById("nickname-input").addEventListener("keydown", function(e) {
    if (e.key === "Enter") startTest();
  });
  
  initParticles();
  checkResume();
  if (hasAccess()) {
    showPage("cover");
  } else {
    showPage("access");
    document.getElementById("access-code-input").focus();
  }
}

// 启动
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}
